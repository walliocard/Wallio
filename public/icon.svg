<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE4FF"/>
    </radialGradient>
    <linearGradient id="w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#007AFF"/>
      <stop offset="50%"  stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3A2FD4" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <text x="256" y="256"
        font-size="340"
        font-family="SF Pro Display,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-weight="800"
        fill="url(#w)"
        text-anchor="middle"
        dominant-baseline="central"
        filter="url(#drop)">W</text>
</svg>
