<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="w" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#007AFF"/>
      <stop offset="50%"  stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#5E5CE6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0F1117"/>

  <text x="256" y="256"
        font-size="340"
        font-family="SF Pro Display,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-weight="800"
        fill="url(#w)"
        text-anchor="middle"
        dominant-baseline="central"
        filter="url(#drop)">W</text>
</svg>
