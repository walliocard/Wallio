<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE8FF"/>
    </radialGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5E2FD4" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Fond blanc avec teinte subtile aux coins -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Halo / glow derrière le W -->
  <text x="256" y="345"
        font-size="320"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-weight="800"
        fill="url(#wGrad)"
        text-anchor="middle"
        opacity="0.18"
        filter="url(#glow)">W</text>

  <!-- W principal avec ombre colorée -->
  <text x="256" y="340"
        font-size="300"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-weight="800"
        fill="url(#wGrad)"
        text-anchor="middle"
        filter="url(#shadow)">W</text>
</svg>
